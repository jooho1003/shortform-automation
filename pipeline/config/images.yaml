# A안 이미지 생성 설정 (캐릭터 시트 · 키프레임)
#
# provider:
#   codex   — codex CLI를 spawn해 이미지 생성 도구로 파일을 만들게 한다(사용자 결정: 사진 생성은 codex).
#             codex가 이미지를 못 만들면 단계가 실패하고 수동 투입 안내를 낸다.
#   manual  — 생성하지 않는다. 사용자가 02-이미지/시트.png, 키프레임-NN.png 를 직접 넣는다.
provider: codex
codex_model: gpt-5.6-terra
reasoning_effort: medium
image_model_hint: gpt-image-2.5
# 컷 하나당 codex 호출 시간 상한(초)
timeout: 600
# 시트는 한 장, 키프레임은 필수 컷만 먼저 (선택 컷은 keyframes_optional: true 로)
keyframes_optional: false
