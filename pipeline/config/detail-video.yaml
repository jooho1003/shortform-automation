# 상세페이지 섹션 영상 설정.
#
# A안 숏폼(fal.yaml)과 분리한 이유: 상세페이지는 9:16이 아니라 4:5·3:2 가로를 섞어 쓰고,
# 움직임도 "느린 푸시인·제형이 흐르는 정도"로 훨씬 얌전하다. 같은 설정을 공유하면
# 한쪽을 조정할 때 다른 쪽이 망가진다.

endpoint: fal-ai/minimax/hailuo-02/standard/image-to-video

# 요청 본문 템플릿. {prompt} {keyframe} {sheet} 가 치환된다.
body:
  prompt: "{prompt}"
  image_url: "{keyframe}"
  duration: "6"
  prompt_optimizer: false

video_url_path: video.url

# 비용 가드. 섹션당 추정 비용 × 섹션 수가 프로젝트 상한을 넘으면 시작하지 않는다.
cost_per_section_usd: 0.6
max_cost_per_project_usd: 6

poll_interval_sec: 6
timeout_sec: 900

# source: sheet 일 때 제품 레퍼런스 시트를 만드는 codex 설정 (images.yaml 과 같은 키)
codex_model: gpt-5.6-terra
reasoning_effort: medium
image_model_hint: gpt-image-2.5
timeout: 600
