# A안 체인 영상 생성 — fal.ai Kling v3 pro (설계 10 §5).
# 시작+끝 프레임을 받고 길이를 정수 초(3~15)로 지정할 수 있어 끝 프레임까지 정확히 재생된다.
# Take Studio는 config/fal.yaml을 따로 쓴다. 이 파일은 steps/video_a.py만 읽는다.
#
# 구현 때 필드 이름을 반드시 확인한다:
#   https://fal.ai/models/fal-ai/kling-video/v3/pro/image-to-video/api
# elements[](캐릭터 참조)는 스키마가 확인되면 body에 추가한다.
endpoint: fal-ai/kling-video/v3/pro/image-to-video

# 문자열 값 안의 {prompt} {keyframe} {end_keyframe} {seconds} {sheet} 가 치환된다.
body:
  prompt: "{prompt}"
  start_image_url: "{keyframe}"
  end_image_url: "{end_keyframe}"
  duration: "{seconds}"
  negative_prompt: "scene change, new person, extra animal, red fox, text, subtitles, morphing, split screen, cartoon"
  generate_audio: false

video_url_path: video.url

# 비용 가드. 초당 단가 × 컷 길이의 합이 편당 상한을 넘으면 시작하지 않는다.
cost_per_second_usd: 0.112
max_cost_per_episode_usd: 10
duration_min_sec: 3
duration_max_sec: 15

poll_interval_sec: 6
timeout_sec: 900
