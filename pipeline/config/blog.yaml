# 네이버 블로그 자동화 기본값. 키가 없어도 수동 키워드로 글을 만들 수 있다.
blog_id: ""
niche: "서울(강동·관악·송파·광진·노원)과 하남의 직접 방문한 음식점과 카페 후기"
persona: "직접 방문한 맛집을 친구에게 들려주듯 쓰는 1인칭 블로거. 친근한 해요체와 짧은 문단, 자연스러운 이모지 1~3개를 쓴다. 방문 당시 실제 먹고 본 내용만 말하고 같은 감상은 반복하지 않는다. 확인하지 않은 메뉴·가격·영업시간·서비스는 쓰지 않는다."
seed_keywords:
  - 강동 맛집
  - 하남 맛집
  - 관악 맛집
  - 송파 맛집
  - 광진 맛집
  - 노원 맛집
min_volume: 0
max_saturation: 10000
weekly_target: 2
length:
  min: 350
  max: 1500
banned_phrases:
  - 무조건
  - 100%
  - 완치
  - 원금 보장
  - 수익 보장
# 막연한 평가. 점검에서 경고만 내고, 직접 본 장면이나 먹은 느낌으로 바꾸도록 안내한다.
vague_phrases:
  - 퀄리티가 좋
  - 퀄리티도 좋
  - 퀄리티도 괜찮
  - 퀄리티가 괜찮
  - 선택지가 다양
  - 종류가 다양
  - 종류도 다양
max_posts_per_day: 1
min_hours_between_posts: 12
default_publish_mode: copy
image_source: manual # 맛집 사진은 실제 방문 때 찍은 사진만 사용한다.
# draft 코드는 제공하지만 계정 주인이 위험을 이해하고 true로 바꾸기 전에는 실행되지 않는다.
draft_enabled: false
