[project]
name = "shortform-pipeline"
version = "0.1.0"
description = "숏폼 자동화 파이프라인 (B 트랙)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "yt-dlp>=2025.1.1",
    "pillow>=10.0",
    "edge-tts>=6.1",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
shortform = "shortform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shortform"]
